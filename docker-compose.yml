services:
  knotelle:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: knotelle-app
    restart: always
    network_mode: "host"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/http.d/default.conf
      - ./backend/routes:/var/www/html/routes
      - ./backend/app:/var/www/html/app
      - ./backend/bootstrap/app.php:/var/www/html/bootstrap/app.php
      - ./backend/resources:/var/www/html/resources
      - ./backend/config/auth.php:/var/www/html/config/auth.php
      - ./backend/config/view.php:/var/www/html/config/view.php
      - ./backend/public:/var/www/html/public
      - ./backend/storage:/var/www/html/storage
      - ./backend/storage/app/public:/var/www/html/public/storage
      - ./backend/.env:/var/www/html/.env
    environment:
      - APP_ENV=production
