services:
  knotelle-db:
    image: mariadb:10.11
    container_name: knotelle-db
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: knottele
      MYSQL_USER: knottele_user
      MYSQL_PASSWORD: KnotelleLive2026!
      MYSQL_ROOT_PASSWORD: KnotelleLive2026!
    volumes:
      - knotelle_mysql_data:/var/lib/mysql

  knotelle:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: knotelle-app
    restart: always
    network_mode: "host"
    depends_on:
      - knotelle-db
    volumes:
      - ./docker/nginx.conf:/etc/nginx/http.d/default.conf
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./docker/php-fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-docker.conf
      - ./backend/routes:/var/www/html/routes
      - ./backend/app:/var/www/html/app
      - ./backend/bootstrap/app.php:/var/www/html/bootstrap/app.php
      - ./backend/resources:/var/www/html/resources
      - ./backend/config/auth.php:/var/www/html/config/auth.php
      - ./backend/config/view.php:/var/www/html/config/view.php
      - ./backend/public:/var/www/html/public
      - ./backend/storage:/var/www/html/storage
      - ./backend/storage/app/public:/var/www/html/public/storage
      - ./backend/.env:/var/www/html/.env
    environment:
      - APP_ENV=production

volumes:
  knotelle_mysql_data:
