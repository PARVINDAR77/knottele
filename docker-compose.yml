services:
  knotelle:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: knotelle-app
    restart: always
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./backend/storage:/var/www/html/storage
      - ./backend/public/images:/var/www/html/public/images
      - ./backend/public/videos:/var/www/html/public/videos
      - ./backend/.env:/var/www/html/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_ENV=production
