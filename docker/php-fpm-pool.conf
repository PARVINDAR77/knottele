[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
; ==============================================================================
; PRODUCTION PHP-FPM POOL TUNING
; Conservative dynamic worker allocation: 16 workers x ~45MB = ~720MB RAM max.
; Guaranteed safe for 2GB to 4GB VPS while supporting 500+ requests/minute.
; ==============================================================================
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000
pm.process_idle_timeout = 10s

request_terminate_timeout = 300s
catch_workers_output = yes
decorate_workers_output = no
