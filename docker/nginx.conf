server {
    listen 8090 default_server;
    listen [::]:8090 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 256M;

    # Open File Cache for static asset performance
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Prevent internal Docker port (8090) or cleartext HTTP scheme from leaking in redirects
    port_in_redirect off;
    absolute_redirect off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Next.js Static Chunks (Support both /_next/ and /knottele/_next/)
    location ^~ /knottele/_next/static/ {
        alias /var/www/html/public/_next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /_next/static/ {
        alias /var/www/html/public/_next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2. Uploaded Storage (Support both /storage/ and /knottele/storage/)
    location ^~ /knottele/storage/ {
        alias /var/www/html/public/storage/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ^~ /storage/ {
        alias /var/www/html/public/storage/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 3. Static Images (Support both /images/ and /knottele/images/)
    location ^~ /knottele/images/ {
        alias /var/www/html/public/images/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    location ^~ /images/ {
        alias /var/www/html/public/images/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # 4. Videos (Support both /videos/ and /knottele/videos/)
    location ^~ /knottele/videos/ {
        alias /var/www/html/public/videos/;
        expires 30d;
        access_log off;
    }

    location ^~ /videos/ {
        alias /var/www/html/public/videos/;
        expires 30d;
        access_log off;
    }

    # 5. Icons and favicons
    location ^~ /knottele/icon.png {
        alias /var/www/html/public/icon.png;
    }
    location ^~ /knottele/favicon.ico {
        alias /var/www/html/public/favicon.ico;
    }

    # 6. API Route Handling (Direct both /knottele/api/ and /api/ to Laravel index.php)
    location ^~ /knottele/api/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    # 7. Static Assets fallback (css, js, media, txt, json)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf|eot|txt|json)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 8. Support /knottele/ base path fallback routing
    location ^~ /knottele/ {
        rewrite ^/knottele(/.*)$ $1 last;
    }

    # 9. Main Application Router (serve static files or subfolder index.html immediately without 301 redirects)
    location / {
        if ($http_rsc = "1") {
            rewrite ^ /index.php last;
        }
        if ($arg__rsc) {
            rewrite ^ /index.php last;
        }
        try_files $uri $uri/index.html $uri.html $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PHP-FPM Handler
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 60;

        # FastCGI In-Memory Buffer Tuning (prevents writing large JSON responses to disk)
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
