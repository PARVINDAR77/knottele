server {
    listen 8090 default_server;
    listen [::]:8090 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 128M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Next.js Static Chunks (Support both /_next/ and /knottele/_next/)
    location ^~ /knottele/_next/static/ {
        alias /var/www/html/public/_next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /_next/static/ {
        alias /var/www/html/public/_next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 2. Uploaded Storage (Support both /storage/ and /knottele/storage/)
    location ^~ /knottele/storage/ {
        alias /var/www/html/public/storage/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ^~ /storage/ {
        alias /var/www/html/public/storage/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 3. Static Images (Support both /images/ and /knottele/images/)
    location ^~ /knottele/images/ {
        alias /var/www/html/public/images/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    location ^~ /images/ {
        alias /var/www/html/public/images/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
    }

    # 4. Videos (Support both /videos/ and /knottele/videos/)
    location ^~ /knottele/videos/ {
        alias /var/www/html/public/videos/;
        expires 30d;
        access_log off;
    }

    location ^~ /videos/ {
        alias /var/www/html/public/videos/;
        expires 30d;
        access_log off;
    }

    # 5. Icons and favicons
    location ^~ /knottele/icon.png {
        alias /var/www/html/public/icon.png;
    }
    location ^~ /knottele/favicon.ico {
        alias /var/www/html/public/favicon.ico;
    }

    # 6. API Route Handling (Direct both /knottele/api/ and /api/ to Laravel index.php)
    location ^~ /knottele/api/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    # 7. Static Assets fallback (css, js, media)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, no-transform";
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 8. Main Application Router
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PHP-FPM Handler
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
